<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="4" y="4" width="1152" height="752" rx="28" fill="#F5F9FF" stroke="#DBE7F7" stroke-width="2"/>

  <!-- applications -->
  <rect x="280" y="44" width="600" height="80" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="580" y="78" text-anchor="middle" font-size="25" font-weight="700" fill="#0F172A">Your applications</text>
  <text x="580" y="106" text-anchor="middle" font-size="17" fill="#64748B">browsers · CLIs · coding agents · containers — unchanged, no proxy config</text>

  <!-- arrow 1 -->
  <line x1="580" y1="126" x2="580" y2="168" stroke="#3B82F6" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="598" y="154" font-size="16" fill="#64748B">ordinary connect() / sendmsg()</text>

  <!-- capture band -->
  <rect x="120" y="176" width="920" height="150" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="580" y="212" text-anchor="middle" font-size="23" font-weight="700" fill="#1E40AF">tunless captures here — the socket layer</text>

  <rect x="150" y="232" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="290" y="260" text-anchor="middle" font-size="17" font-weight="600" fill="#1E40AF">Linux · eBPF cgroup</text>

  <rect x="440" y="232" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="580" y="260" text-anchor="middle" font-size="17" font-weight="600" fill="#1E40AF">macOS · Network Extension</text>

  <rect x="730" y="232" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="870" y="260" text-anchor="middle" font-size="17" font-weight="600" fill="#1E40AF">Windows · WFP</text>

  <text x="580" y="306" text-anchor="middle" font-size="16.5" fill="#475569">sees the real destination and the calling process — no TUN device, no route changes, no fake DNS answers</text>

  <!-- arrow 2 -->
  <line x1="580" y1="328" x2="580" y2="370" stroke="#3B82F6" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="598" y="356" font-size="16" fill="#64748B">flows handed over with their real addresses</text>

  <!-- core -->
  <rect x="280" y="378" width="600" height="80" rx="16" fill="#FFFFFF" stroke="url(#accent)" stroke-width="3"/>
  <text x="580" y="412" text-anchor="middle" font-size="25" font-weight="700" fill="#0F172A">tunless core</text>
  <text x="580" y="440" text-anchor="middle" font-size="17" fill="#64748B">capture filters · trusted DNS override · SOCKS5 emitter</text>

  <!-- arrow 3 -->
  <line x1="580" y1="460" x2="580" y2="502" stroke="#3B82F6" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="598" y="488" font-size="16" fill="#64748B">plain SOCKS5 — TCP and UDP</text>

  <!-- upstream -->
  <rect x="280" y="510" width="600" height="80" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="580" y="544" text-anchor="middle" font-size="25" font-weight="700" fill="#0F172A">Your existing proxy — mihomo / sing-box</text>
  <text x="580" y="572" text-anchor="middle" font-size="17" fill="#64748B">nodes, subscriptions, and routing rules stay here</text>

  <!-- arrow 4 -->
  <line x1="580" y1="592" x2="580" y2="634" stroke="#14B8A6" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- internet -->
  <rect x="430" y="642" width="300" height="64" rx="32" fill="url(#accent)"/>
  <text x="580" y="682" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">Internet</text>
</svg>
