name: Tunless
options:
  bundleIdPrefix: com.bojieli.tunless
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 5BR9M56H9W
targets:
  Tunless:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Sources/TunlessLauncher
      # Shared with the extension so both sides frame probe queries the same
      # way; the app builds the file directly rather than importing a module
      # the system extension target does not link.
      - path: Sources/TunlessExtension/DNSProbeMessage.swift
      - path: Sources/TunlessExtension/ControlMessage.swift
      - path: Resources
        buildPhase: resources
    settings:
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: tunless
        CFBundleShortVersionString: 1.0.8
        CFBundleVersion: "13"
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
    entitlements:
      path: App/Tunless.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - app-proxy-provider-systemextension
        com.apple.developer.system-extension.install: true
    dependencies:
      - target: TunlessProxy
        embed: true
        codeSign: true
  TunlessProxy:
    type: system-extension
    platform: macOS
    sources: [Sources/TunlessExtension, Extension/main.swift]
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: tunless transparent proxy
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: 1.0.8
        CFBundleVersion: "13"
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.app-proxy: $(PRODUCT_MODULE_NAME).TransparentProxyProvider
        NSSystemExtensionUsageDescription: tunless transparently sends selected application connections to your local SOCKS5 proxy.
    settings:
      base:
        ENABLE_APP_SANDBOX: YES
        EXECUTABLE_NAME: TunlessProxy
        PRODUCT_MODULE_NAME: TunlessProxy
        PRODUCT_NAME: com.bojieli.tunless.TunlessProxy
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Extension/TunlessProxy.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.networking.networkextension:
          - app-proxy-provider-systemextension
    dependencies:
      - sdk: Network.framework
      - sdk: NetworkExtension.framework
