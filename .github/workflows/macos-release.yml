name: macOS signed release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notarize:
        description: Submit the signed bundle to the Apple notary service
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    name: Sign, notarize, and staple Tunless.app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify signing secrets are present
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.APPLE_PROVISIONING_PROFILE_APP }}
          PROFILE_EXT: ${{ secrets.APPLE_PROVISIONING_PROFILE_EXT }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          NOTARIZE: ${{ inputs.notarize == null && 'true' || inputs.notarize }}
        run: |
          set -euo pipefail
          missing=""
          for name in P12 P12_PASSWORD PROFILE_APP PROFILE_EXT TEAM_ID; do
            [ -n "${!name:-}" ] || missing="$missing APPLE_$name"
          done
          if [ "$NOTARIZE" = "true" ]; then
            for name in API_KEY API_KEY_ID API_ISSUER_ID; do
              [ -n "${!name:-}" ] || missing="$missing APPLE_$name"
            done
          fi
          if [ -n "$missing" ]; then
            echo "Missing required repository secrets:$missing" >&2
            exit 1
          fi
          echo "All required secrets are present."

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create signing keychain
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/tunless-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"

          printf '%s' "$P12" | openssl base64 -d -A -out "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Prepend the signing keychain to the user search list, preserving
          # the existing entries (one quoted path per line).
          existing=()
          while IFS= read -r line; do
            line="${line#\"}"; line="${line%\"}"
            [ -n "$line" ] && existing+=("$line")
          done < <(security list-keychains -d user | sed 's/^ *//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing[@]}"
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Imported identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -q "Developer ID Application" \
            || { echo "Developer ID Application identity missing after import" >&2; exit 1; }

      - name: Install provisioning profiles
        env:
          PROFILE_APP: ${{ secrets.APPLE_PROVISIONING_PROFILE_APP }}
          PROFILE_EXT: ${{ secrets.APPLE_PROVISIONING_PROFILE_EXT }}
        run: |
          set -euo pipefail
          umask 077
          # Xcode reads macOS profiles from both of these locations depending on version.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
          done

          install_profile() {
            local b64="$1" label="$2" var="$3" tmp uuid name dest
            tmp="$(mktemp "$RUNNER_TEMP/profile.XXXXXX")"
            printf '%s' "$b64" | openssl base64 -d -A -out "$tmp"
            uuid="$(security cms -D -i "$tmp" | plutil -extract UUID raw -o - -)"
            name="$(security cms -D -i "$tmp" | plutil -extract Name raw -o - -)"
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              cp "$tmp" "$dir/$uuid.provisionprofile"
            done
            dest="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.provisionprofile"
            rm -f "$tmp"
            echo "PROFILE_${var}_PATH=$dest" >> "$GITHUB_ENV"
            echo "Installed $label profile '$name' ($uuid)"
          }

          install_profile "$PROFILE_APP" app APP
          install_profile "$PROFILE_EXT" extension EXT

      - name: Generate Xcode project
        run: xcodegen generate --spec macos/project.yml

      - name: Archive Release build (unsigned)
        run: |
          set -euo pipefail
          # Signing is deferred to scripts/macos-sign.sh: xcodebuild's manual
          # signing path rejects Xcode-managed profiles, and the team's only
          # valid Direct profiles are Xcode-managed.
          xcodebuild archive \
            -project macos/Tunless.xcodeproj \
            -scheme Tunless \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Tunless.xcarchive" \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign with Developer ID
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          APP="$RUNNER_TEMP/export/Tunless.app"
          rm -rf "$APP"
          cp -R "$RUNNER_TEMP/Tunless.xcarchive/Products/Applications/Tunless.app" "$APP"

          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$identity" \
            || { echo "no Developer ID Application identity in the keychain" >&2; exit 1; }

          bash scripts/macos-sign.sh \
            --app "$APP" \
            --identity "$identity" \
            --app-profile "$PROFILE_APP_PATH" \
            --ext-profile "$PROFILE_EXT_PATH" \
            --keychain "$KEYCHAIN_PATH"

      - name: Verify signature and entitlements
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/Tunless.app"
          test -d "$APP" || { echo "Tunless.app missing from export" >&2; exit 1; }

          # PRODUCT_NAME carries the full bundle id, so match by suffix instead
          # of hardcoding the .systemextension file name.
          SYSEX="$(find "$APP/Contents/Library/SystemExtensions" \
            -maxdepth 1 -name '*.systemextension' -print -quit 2>/dev/null)"
          test -n "$SYSEX" && test -d "$SYSEX" \
            || { echo "no .systemextension embedded in Tunless.app" >&2; exit 1; }
          echo "system extension: $SYSEX"

          echo "--- app signature ---"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Runtime'

          echo "--- app must be Developer ID signed with a hardened runtime ---"
          codesign -dv --verbose=4 "$APP" 2>&1 \
            | grep -q 'Authority=Developer ID Application' \
            || { echo "app is not Developer ID signed" >&2; exit 1; }
          codesign -d --verbose=4 "$APP" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "app is missing the hardened runtime flag" >&2; exit 1; }

          echo "--- entitlements ---"
          codesign -d --entitlements :- "$APP" \
            | plutil -convert xml1 -o "$RUNNER_TEMP/app-ent.plist" -
          codesign -d --entitlements :- "$SYSEX" \
            | plutil -convert xml1 -o "$RUNNER_TEMP/ext-ent.plist" -
          plutil -p "$RUNNER_TEMP/app-ent.plist"
          plutil -p "$RUNNER_TEMP/ext-ent.plist"

          require() {
            grep -qF "<key>$2</key>" "$1" \
              || { echo "missing entitlement $2 in $1" >&2; exit 1; }
          }
          require "$RUNNER_TEMP/app-ent.plist" 'com.apple.developer.system-extension.install'
          require "$RUNNER_TEMP/ext-ent.plist" 'com.apple.developer.networking.networkextension'
          require "$RUNNER_TEMP/ext-ent.plist" 'com.apple.security.app-sandbox'
          require "$RUNNER_TEMP/ext-ent.plist" 'com.apple.security.network.client'
          echo "Entitlement checks passed."

      - name: Notarize and staple
        if: ${{ inputs.notarize == null || inputs.notarize }}
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          APP="$RUNNER_TEMP/export/Tunless.app"
          ZIP="$RUNNER_TEMP/Tunless-notarize.zip"
          KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$API_KEY" > "$KEY_PATH"

          cleanup() { rm -f "$KEY_PATH"; }
          trap cleanup EXIT

          ditto -c -k --keepParent "$APP" "$ZIP"

          set +e
          output="$(xcrun notarytool submit "$ZIP" \
            --key "$KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m 2>&1)"
          submit_status=$?
          set -e
          echo "$output"

          submission_id="$(printf '%s\n' "$output" | awk '/^ *id: /{print $2; exit}')"
          if [ $submit_status -ne 0 ] || ! printf '%s\n' "$output" | grep -q 'status: Accepted'; then
            echo "Notarization did not succeed; fetching the notary log." >&2
            if [ -n "$submission_id" ]; then
              xcrun notarytool log "$submission_id" \
                --key "$KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" || true
            fi
            exit 1
          fi

          # Ticket propagation to the CloudKit endpoint can lag briefly after
          # acceptance, so retry the staple before giving up.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$APP"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "stapling failed after $attempt attempts" >&2
              exit 1
            fi
            echo "staple attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          xcrun stapler validate "$APP"

      - name: Gatekeeper assessment
        if: ${{ inputs.notarize == null || inputs.notarize }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/Tunless.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Package release archive
        id: package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/Tunless.app"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          build="$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")"
          out="$RUNNER_TEMP/Tunless-${version}-${build}.zip"
          ditto -c -k --keepParent "$APP" "$out"
          shasum -a 256 "$out" | tee "$out.sha256"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "name=Tunless-${version}-${build}" >> "$GITHUB_OUTPUT"

      - name: Upload signed bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          set -uo pipefail
          security default-keychain -s login.keychain-db 2>/dev/null || true
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            rm -f "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP"/*.p8 "$RUNNER_TEMP"/*.p12 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.provisionprofile 2>/dev/null || true
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.provisionprofile 2>/dev/null || true
          echo "Signing material removed."
