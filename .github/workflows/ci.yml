name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go, BPF API, and containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/tunless-linux-amd64 ./cmd/tunless
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/tunless-windows-amd64.exe ./cmd/tunless
      - run: bash -n scripts/*.sh
      - run: docker build --file packaging/docker/Dockerfile .
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.26.6
          go-package: ./...

  macos:
    name: macOS extension
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - run: go test ./...
      - run: swift test
        working-directory: macos

  windows:
    name: Windows service source
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - run: go test ./...
      - name: Parse PowerShell launchers
        shell: pwsh
        run: Get-ChildItem scripts/*.ps1 | ForEach-Object { [void][ScriptBlock]::Create((Get-Content -Raw $_)) }
