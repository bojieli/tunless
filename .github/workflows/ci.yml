name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go, BPF API, and containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.6
          cache: true
      - run: go test -race ./...
      - run: TUNLESS_STRESS_CONNECTIONS=10000 ./scripts/stress.sh
      - run: go vet ./...
      - run: go mod verify
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - run: go run github.com/google/go-licenses/v2@v2.0.1 check ./... --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/tunless-linux-amd64 ./cmd/tunless
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/tunless-windows-amd64.exe ./cmd/tunless
      - name: Check shell launchers
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          bash -n scripts/*.sh packaging/nfpm/*.sh
          shellcheck scripts/*.sh packaging/nfpm/*.sh
      - run: docker build --file packaging/docker/Dockerfile .
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: 1.26.6
          go-package: ./...
          check-latest: false
          cache: false
          repo-checkout: false

  macos:
    name: macOS extension
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.6
          cache: true
      - run: go test ./...
      - run: swift test
        working-directory: macos

  windows:
    name: Windows service source
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.6
          cache: true
      - run: go test ./...
      - name: Parse PowerShell launchers
        shell: pwsh
        run: Get-ChildItem scripts/*.ps1 | ForEach-Object { [void][ScriptBlock]::Create((Get-Content -Raw $_)) }
