name: Scheduled fuzzing

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SOCKS client addresses
            package: ./socks5
            fuzz: FuzzParseAddr
          - name: SOCKS inbound addresses
            package: ./backend/loopback
            fuzz: FuzzSOCKSAddresses
          - name: DNS observer
            package: ./dnsobserver
            fuzz: FuzzObserveDNS
          - name: Metadata API
            package: ./metadata
            fuzz: FuzzMetadataLookup
          - name: CLI configuration
            package: ./cmd/tunless
            fuzz: FuzzConfigurationParsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: 1.27.4
          cache: true
      - name: Run fuzz target
        run: go test "${{ matrix.package }}" -run='^$' -fuzz="^${{ matrix.fuzz }}$" -fuzztime=2m
      - name: Preserve crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crash-${{ strategy.job-index }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
