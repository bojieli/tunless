name: Scheduled fuzzing

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SOCKS client addresses
            package: ./socks5
            fuzz: FuzzParseAddr
          - name: SOCKS inbound addresses
            package: ./backend/loopback
            fuzz: FuzzSOCKSAddresses
          - name: DNS observer
            package: ./dnsobserver
            fuzz: FuzzObserveDNS
          - name: Metadata API
            package: ./metadata
            fuzz: FuzzMetadataLookup
          - name: CLI configuration
            package: ./cmd/tunless
            fuzz: FuzzConfigurationParsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.6
          cache: true
      - name: Run fuzz target
        run: go test "${{ matrix.package }}" -run='^$' -fuzz="^${{ matrix.fuzz }}$" -fuzztime=2m
      - name: Preserve crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crash-${{ strategy.job-index }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
